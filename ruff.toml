# Ruff 設定
# Python スクリプトの健全性チェックに用いる。
# 既存コードのスタイルを尊重し、バグに直結しやすいエラー系ルールに絞って有効化する。
# 方針は C2M-Export の ruff.toml と同一（対象バージョンのみ Python 3.9 に合わせる）。

target-version = "py39"
line-length = 120

[lint]
# E9  : 構文エラー等（実行を妨げる致命的な問題）
# F   : pyflakes（未使用 import/変数、未定義名など、バグに直結しやすい問題）
# I   : isort（import 順序の整列。自動修正可能で差分も安全）
# UP  : pyupgrade（古い書き方を対象 Python バージョン向けにモダン化）
select = ["E9", "F", "I", "UP"]

# UP031（%-整形から .format への置換）は対象外。
# このコードベースでは %-整形を意図的に統一して使っており、置換は unsafe な自動修正になるため。
ignore = ["UP031"]

[lint.per-file-ignores]
# テストでは検証用の import が必要なケースがあるため、未使用 import の指摘を緩和する。
"**/tests/*" = ["F401"]
