ci:
  autofix_commit_msg: "[pre-commit.ci] auto fixes from pre-commit.com hooks"
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      # Python スクリプトの健全性チェック
      - id: check-ast # Python ファイルが構文的に妥当か（パース可能か）を確認
      - id: check-merge-conflict # マージコンフリクトの残骸を検出
      - id: debug-statements # pdb 等のデバッグ用ステートメントの残しを検出
      - id: check-docstring-first # docstring がコードより前に置かれているかを確認
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Ruff: 高速な Python リンター。
  # バグに直結しやすいエラー系ルール（E9, F 等）に絞って有効化。詳細な設定は ruff.toml を参照。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      # ruff-format: 一貫したコードフォーマットを自動適用
      - id: ruff-format
